[package]
name = "telegram"
module_roots = ["src", "tests"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "5a2a5cd955b979bc544e3d95f84576751d5361be"

[exports]
tl = "src/tl.zi"
encoding = "src/encoding.zi"
mtproto = "src/mtproto.zi"
