auth = "src/auth.zi"
messages = "src/messages.zi"
members = "src/members.zi"
folders = "src/folders.zi"
session = "src/session.zi"

[dependencies.crypto]
git = "https://git.waozi.xyz/ziranlang/crypto.git"
ref = "ba50e2bde7bde53779aec7fdbcd807cc83c69a19"

[dependencies.compression]
git = "https://git.waozi.xyz/ziranlang/compression.git"
ref = "b081b26058daac4c61c2f7cb0cdff36496363b18"
